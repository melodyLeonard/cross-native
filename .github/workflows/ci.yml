name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Node 22.6+ is required for --experimental-strip-types, which is how the
      # TypeScript sources run without a build step.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      # Install workspace deps. The published packages ship compiled JS, so the
      # core suite builds them to dist first (see build:packages).
      - name: Install deps
        run: npm ci || npm install

      # The C++ core suite: builds WAMR plus CrossNative, compiles the Rust
      # fixture to WASM, and runs the runtime checks.
      - name: Native test suite
        run: npm run test:native

      # The TypeScript integration suite, driving the same core through the
      # development host binary.
      - name: Core test suite
        run: npm run test:core
