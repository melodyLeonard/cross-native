name: Publish

# Publishes all four packages to npm. Runs on a manual dispatch, or on a push to
# main whose commit message contains "[publish]" — so ordinary pushes never
# re-publish. Uses the NPM_TOKEN repo secret (a granular access token).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      # Publish each package in dependency order. Idempotent: a version already
      # on the registry is skipped, so re-runs are safe. Any real failure is
      # surfaced as an annotation.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in languages core compiler native; do
            cd "packages/$pkg"
            name=$(node -p "require('./package.json').name")
            ver=$(node -p "require('./package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver already published — skipping"
            elif out=$(npm publish --tag alpha --access public 2>&1); then
              echo "published $name@$ver"
            else
              echo "$out"
              echo "::error::$name: $(echo "$out" | grep -iE 'npm error|forbidden|403|401|otp|two-factor|permission|E[A-Z]+' | tr '\n' ' ' | tail -c 400)"
              exit 1
            fi
            cd ../..
          done
