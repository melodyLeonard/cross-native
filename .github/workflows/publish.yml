name: Publish

# Publishes all four packages to npm. Runs on a manual dispatch, or on a push to
# main whose commit message contains "[publish]" — so ordinary pushes never
# re-publish. Uses the NPM_TOKEN repo secret (a granular access token).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      # Install workspace deps and build the TypeScript packages to dist JS,
      # since the published packages ship compiled JavaScript (Node cannot strip
      # TypeScript types under node_modules).
      - run: npm ci || npm install
      - run: |
          node scripts/build-packages.mjs

      # Publish each package in dependency order. Idempotent: a version already
      # on the registry is skipped, so re-runs are safe. Any real failure is
      # surfaced as an annotation.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in languages core compiler native; do
            cd "packages/$pkg"
            name=$(node -p "require('./package.json').name")
            ver=$(node -p "require('./package.json').version")
            # A prerelease version (e.g. 1.2.3-alpha.4) ships under its prerelease
            # dist-tag; a plain version ships under "latest".
            if [[ "$ver" == *-* ]]; then tag="${ver#*-}"; tag="${tag%%.*}"; else tag="latest"; fi
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver already published — skipping"
            elif out=$(npm publish --tag "$tag" --access public 2>&1); then
              echo "published $name@$ver (tag: $tag)"
            else
              echo "$out"
              echo "::error::$name: $(echo "$out" | grep -iE 'npm error|forbidden|403|401|otp|two-factor|permission|E[A-Z]+' | tr '\n' ' ' | tail -c 400)"
              exit 1
            fi
            cd ../..
          done
