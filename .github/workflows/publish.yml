name: Publish

# Publishes all four packages to npm. Runs on a manual dispatch, or on a push to
# main whose commit message contains "[publish]" — so ordinary pushes never
# re-publish. Uses the NPM_TOKEN repo secret (a granular access token).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      # Dependency order: languages first. --access public is required for the
      # scoped @cross-native/* packages.
      - name: Publish @cross-native/languages
        working-directory: packages/languages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          W=$(npm whoami 2>&1 || echo "NOAUTH")
          echo "::warning::whoami=$W"
          if out=$(npm publish --tag alpha --access public 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "::error::$(echo "$out" | grep -iE 'npm error|forbidden|403|401|otp|two-factor|permission|E[A-Z]+' | tr '\n' ' ' | tail -c 500)"
            exit 1
          fi

      - name: Publish @cross-native/core
        run: npm publish --tag alpha --access public
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @cross-native/compiler
        run: npm publish --tag alpha --access public
        working-directory: packages/compiler
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish react-native-cross-native
        run: npm publish --tag alpha --access public
        working-directory: packages/native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
