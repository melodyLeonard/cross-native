apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34
    
    namespace "com.crossnative"
    
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        
        externalNativeBuild {
            cmake {
                cppFlags "-O3 -std=c++20 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared",
                         "-DCROSSNATIVE_ENABLE_WASM=ON"
            }
        }
    }
    
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    cppFlags "-O3 -DNDEBUG"
                }
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    cppFlags "-O0 -g"
                }
            }
        }
    }
    
    packagingOptions {
        pickFirst '**/libc++_shared.so'
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    implementation 'com.margelo.nitro:core:+'
    
    // Optional: WASM runtime for Android
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
