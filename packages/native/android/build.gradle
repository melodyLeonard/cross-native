apply plugin: 'com.android.library'

/** Prefer the host app's setting, so the library follows its SDK levels. */
def resolveExt(name, defaultValue) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

android {
    namespace "com.crossnative"
    compileSdk resolveExt('compileSdkVersion', 35)

    if (rootProject.hasProperty("ndkVersion")) {
        ndkVersion rootProject.ext.ndkVersion
    }

    defaultConfig {
        minSdk resolveExt('minSdkVersion', 24)

        // This native build is aarch64-specific (AOT reloc + trampoline).
        ndk { abiFilters "arm64-v8a" }

        externalNativeBuild {
            cmake {
                // fbjni and JSI both require RTTI and exceptions.
                cppFlags "-std=c++20", "-frtti", "-fexceptions", "-O2"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    // Lets CMake find ReactAndroid and fbjni via find_package.
    buildFeatures {
        prefab true
    }

    packagingOptions {
        // These ship with React Native itself; bundling a second copy makes the
        // APK fail to install.
        excludes += [
            "**/libc++_shared.so",
            "**/libfbjni.so",
            "**/libjsi.so",
            "**/libreactnative.so",
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
}
