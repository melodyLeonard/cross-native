[package]
name = "cross-native-rust"
version = "0.0.1"
edition = "2021"
authors = ["CrossNative Contributors"]
description = "Rust runtime for CrossNative - React Native native module support"
license = "Apache-2.0"
repository = "https://github.com/yourusername/cross-native"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
# JSI / React Native bindings
uniffi = "0.28"

# Async runtime
tokio = { version = "1.36", features = ["rt-multi-thread", "sync", "time"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
lazy_static = "1.4"
parking_lot = "0.12"
once_cell = "1.19"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[[bench]]
name = "native_calls"
harness = false
